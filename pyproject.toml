[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taiko-diffusion"
version = "0.1.0"
description = "Automatic osu!taiko chart generation from music."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "librosa>=0.10.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "torch>=2.2.0",
  "tqdm>=4.66.0",
]

[project.scripts]
taiko-train = "src.training.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
