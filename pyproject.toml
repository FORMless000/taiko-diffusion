[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taiko-diffusion"
version = "0.1.0"
description = "Automatic osu!taiko chart generation from music."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "librosa>=0.10.0",
  "matplotlib>=3.7.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "torch>=2.1.0",
  "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[project.optional-dependencies]
wandb = [
  "wandb>=0.17.0",
]
webapp = [
  "fastapi>=0.110.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29.0",
]
